name: atlas-logistics

x-common-security: &common_security
  security_opt:
    - no-new-privileges:true

x-common-healthcheck: &default_healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ============================================================================
  # BACKEND SERVICE (Node.js + Fastify)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 11.5.1
    image: atlas-logistics:backend-prod
    container_name: atlas-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/data/prod.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_PRODUCTION_SECRET}
    expose:
      - "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      <<: *default_healthcheck
    networks:
      atlas-network:
        aliases:
          - api
          - backend
    <<: *common_security
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # FRONTEND SERVICE (Nginx reverse proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 11.5.1
        VITE_API_URL: ${VITE_API_URL:-https://api.example.com}
    image: atlas-logistics:frontend-prod
    container_name: atlas-frontend-prod
    restart: always
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      <<: *default_healthcheck
    <<: *common_security
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # REDIS (Message Queue & Cache)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    container_name: atlas-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-atlas-secure-pass-change-me}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    <<: *common_security
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  redis_data:
    driver: local

networks:
  atlas-network:
    name: atlas-network
    driver: bridge
