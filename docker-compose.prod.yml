# ==============================================================================
# ATLAS LOGISTICS — DOCKER COMPOSE FOR PRODUCTION DEPLOYMENT
# ==============================================================================
# Single-host production deployment with proper resource limits, networking,
# restart policies, and comprehensive healthchecks.
#
# For multi-node deployments, use Docker Swarm or Kubernetes.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d                 # Deploy
#   docker compose -f docker-compose.prod.yml logs -f backend       # Tail logs
#   docker compose -f docker-compose.prod.yml down                  # Stop
#
# ==============================================================================


x-common-variables: &common_env
  NODE_ENV: production
  LOG_LEVEL: info

x-health-check: &default_healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ============================================================================
  # BACKEND SERVICE (Node.js + Fastify + SQLite + BullMQ)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 11.5.1
    container_name: atlas-backend-prod
    image: atlas-logistics:backend-prod
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *common_env
      DATABASE_URL: "${DATABASE_URL:?ERROR: DATABASE_URL must be set for production}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      # Data persistence for SQLite database
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli --version >/dev/null && node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default:
        aliases:
          - api
          - backend
    # Resource limits prevent memory leaks and runaway processes
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
        reservations:
          cpus: '1'
          memory: 1.5G
    security_opt:
      - no-new-privileges:true
    read_only: false  # Allow writes to /app/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================================
  # FRONTEND SERVICE (Nginx SPA + API reverse proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 11.5.1
    container_name: atlas-frontend-prod
    image: atlas-logistics:frontend-prod
    restart: always
    ports:
      - "80:8080"
      - "443:8443"  # Enable TLS termination (configure with cert volumes)
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      <<: *default_healthcheck
    networks:
      - default
    # volumes:
    #   # Optional: TLS certificates for HTTPS
    #   # - /etc/letsencrypt/live/example.com:/etc/nginx/certs:ro
    #   # - /etc/letsencrypt/live/example.com:/etc/ssl/certs:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================================
  # WORKER SERVICE (BullMQ Background Jobs)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 11.5.1
    container_name: atlas-worker-prod
    image: atlas-logistics:worker-prod
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      <<: *common_env
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENABLE_WORKERS: "true"
    volumes:
      # Shared data directory for SQLite
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.75'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ============================================================================
  # REDIS (Message Queue & Cache)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    container_name: atlas-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # Persistent RDB snapshots + AOF log
      - redis_data:/data
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "900 1"
      - "--save"
      - "300 10"
      - "--save"
      - "60 10000"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: atlas-network
    driver: bridge

