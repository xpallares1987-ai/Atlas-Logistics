name: Pull Request Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Manage PR Preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1. Checkout unconditionally FIRST so Git context exists for removals
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Cleanup step runs if PR is closed
      - name: Cleanup Preview on PR Close
        if: ${{ github.event.action == 'closed' }}
        uses: rossjrw/pr-preview-action@430e3dfc1de8a8ae77e77d862d25676ef9db55d1 # v1.4.8
        with:
          source-dir: ./packages/frontend/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup and Build steps run only if PR is active
      - name: Setup pnpm
        if: ${{ github.event.action != 'closed' }}
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        if: ${{ github.event.action != 'closed' }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        if: ${{ github.event.action != 'closed' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build PR Preview SPA
        if: ${{ github.event.action != 'closed' }}
        env:
          VITE_BASE_PATH: "/Atlas-Logistics/pr-preview/pr-${{ github.event.number }}/"
          VITE_API_URL: "${{ secrets.VITE_API_URL || 'https://atlas-backend-100198375762.europe-west1.run.app/api' }}"
        run: pnpm run build

      - name: Deploy PR Preview to gh-pages
        if: ${{ github.event.action != 'closed' }}
        uses: rossjrw/pr-preview-action@430e3dfc1de8a8ae77e77d862d25676ef9db55d1 # v1.4.8
        with:
          source-dir: ./packages/frontend/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          token: ${{ secrets.GITHUB_TOKEN }}
