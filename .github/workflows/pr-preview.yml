name: Pull Request Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Manage PR Preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1. Checkout unconditionally FIRST so Git context exists for removals
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Cleanup step runs if PR is closed
      - name: Cleanup Preview on PR Close
        if: ${{ github.event.action == 'closed' }}
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./packages/frontend/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup and Build steps run only if PR is active
      - name: Setup pnpm
        if: ${{ github.event.action != 'closed' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        if: ${{ github.event.action != 'closed' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        if: ${{ github.event.action != 'closed' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build PR Preview SPA
        if: ${{ github.event.action != 'closed' }}
        env:
          VITE_BASE_PATH: "/Atlas-Logistics/pr-preview/pr-${{ github.event.number }}/"
          VITE_API_URL: "${{ secrets.VITE_API_URL || 'https://atlas-backend-100198375762.europe-west1.run.app/api' }}"
        run: pnpm run build

      - name: Deploy PR Preview to gh-pages
        if: ${{ github.event.action != 'closed' }}
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./packages/frontend/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          token: ${{ secrets.GITHUB_TOKEN }}
