name: Container Release & Security Audit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild ignoring cache'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_INSTALL_RETRY_TIMES: '3'
  npm_config_fetch_timeout: '120000'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_network_timeout: '120000'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Dynamic Image Namespace
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image_repo: ${{ steps.repo.outputs.image_repo }}
    steps:
      - id: repo
        run: echo "image_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push ${{ matrix.image-suffix }} Image
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: production
            image-suffix: frontend
          - dockerfile: Dockerfile.backend
            target: production
            image-suffix: backend
          - dockerfile: Dockerfile.worker
            target: production
            image-suffix: worker

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.image-suffix }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.image-suffix }}-${{ github.ref_name }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image-suffix }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image-suffix }}
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1
            BUILDKIT_INLINE_CACHE=1
          network: host

      - name: Generate SLSA artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify image pull
        run: |
          docker pull ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest
          docker inspect ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest

      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.image-suffix }}
          path: /tmp/buildkit-*.log
          retention-days: 7

  security-scan:
    name: Trivy Security Scan (${{ matrix.image-suffix }})
    needs: [prepare, build-and-push]
    runs-on: ubuntu-24.04
    if: success()
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image-suffix: [frontend, backend, worker]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          category: 'trivy-${{ matrix.image-suffix }}'

  report-summary:
    name: Execution Summary
    needs: [prepare, build-and-push, security-scan]
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
    steps:
      - name: Publish Summary to Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 📦 Container Release & Security Audit Results
          - **Dynamic Namespace**: `${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}`
          - **Build & Push Status**: ${{ needs.build-and-push.result == 'success' && '✅ Success' || '❌ Failed' }}
          - **Trivy Vulnerability Scan & SARIF Upload**: ${{ needs.security-scan.result == 'success' && '✅ Clean / Processed' || '⚠️ Completed with warnings' }}
          EOF
