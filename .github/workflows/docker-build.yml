name: Container Release & Security Audit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild ignoring cache'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_INSTALL_RETRY_TIMES: '3'
  npm_config_fetch_timeout: '120000'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_network_timeout: '120000'

jobs:
  prepare:
    name: Prepare Dynamic Image Namespace
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.repo.outputs.image_repo }}
    steps:
      - id: repo
        run: echo "image_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push ${{ matrix.image-suffix }} Image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: production
            image-suffix: frontend
          - dockerfile: Dockerfile.backend
            target: production
            image-suffix: backend
          - dockerfile: Dockerfile.worker
            target: production
            image-suffix: worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.image-suffix }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.image-suffix }}-${{ github.ref_name }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image-suffix }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image-suffix }}
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1
            BUILDKIT_INLINE_CACHE=1
          network: host

      - name: Verify image pull
        run: |
          docker pull ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest
          docker inspect ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest

      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.image-suffix }}
          path: /tmp/buildkit-*.log
          retention-days: 7

  security-scan:
    name: Trivy Security Scan (${{ matrix.image-suffix }})
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image-suffix: [frontend, backend, worker]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}:${{ matrix.image-suffix }}-latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          category: 'trivy-${{ matrix.image-suffix }}'

  report-summary:
    name: Execution Summary
    needs: [prepare, build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Publish Summary to Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 📦 Container Release & Security Audit Results
          - **Dynamic Namespace**: `${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}`
          - **Build & Push Status**: ${{ needs.build-and-push.result == 'success' && '✅ Success' || '❌ Failed' }}
          - **Trivy Vulnerability Scan & SARIF Upload**: ${{ needs.security-scan.result == 'success' && '✅ Clean / Processed' || '⚠️ Completed with warnings' }}
          EOF
