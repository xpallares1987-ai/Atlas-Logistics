name: Build & Push Container Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild ignoring cache'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Network and build configuration for large monorepos
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_INSTALL_RETRY_TIMES: '3'
  npm_config_fetch_timeout: '120000'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_network_timeout: '120000'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: production
            image-suffix: frontend
          - dockerfile: Dockerfile.backend
            target: production
            image-suffix: backend
          - dockerfile: Dockerfile.worker
            target: production
            image-suffix: worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.image-suffix }}-latest,enable={{is_default_branch}}

      - name: Build and push image (retry wrapper)
        id: build
        shell: bash
        run: |
          set +e  # Don't exit on error
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Build attempt $attempt of $max_attempts..."
            
            docker buildx build \
              --file ./${{ matrix.dockerfile }} \
              --target ${{ matrix.target }} \
              --push=${{ github.event_name != 'pull_request' }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image-suffix }}-latest \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image-suffix }}-${{ github.sha }} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg NODE_VERSION=22 \
              --build-arg PNPM_VERSION=11.5.1 \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --network host \
              .
            
            if [ $? -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            
            echo "Build failed on attempt $attempt, retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done
          
          echo "Build failed after $max_attempts attempts"
          exit 1

      - name: Verify image pushed
        if: github.event_name != 'pull_request' && success()
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image-suffix }}-latest
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image-suffix }}-latest

      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.image-suffix }}
          path: /tmp/buildkit-*.log
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && success()
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image-suffix: [frontend, backend, worker]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.image-suffix }}-latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.image-suffix }}.sarif'
          category: 'trivy-${{ matrix.image-suffix }}'

  test-deployment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: network=host

      - name: Load and test frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: atlas:frontend-test
          cache-from: type=gha
          build-args: NODE_VERSION=22
          network: host

      - name: Load and test backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          target: production
          load: true
          tags: atlas:backend-test
          cache-from: type=gha
          build-args: NODE_VERSION=22
          network: host

      - name: Load and test worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          target: production
          load: true
          tags: atlas:worker-test
          cache-from: type=gha
          build-args: NODE_VERSION=22
          network: host

      - name: Verify images exist
        run: |
          docker image inspect atlas:frontend-test
          docker image inspect atlas:backend-test
          docker image inspect atlas:worker-test
          echo "✓ All images built successfully"

      - name: Run image health checks
        run: |
          # Test frontend (nginx should start)
          docker run --rm --entrypoint /bin/sh atlas:frontend-test -c "nginx -t" || true
          
          # Verify backend image has node runtime
          docker run --rm atlas:backend-test --version
          
          # Verify worker image has node runtime
          docker run --rm atlas:worker-test --version

  notify-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [build-and-push]

    steps:
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Container image build failed. Check [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
