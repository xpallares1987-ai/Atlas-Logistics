name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with ESLint
        run: pnpm run lint
        continue-on-error: false

      - name: Type check
        run: |
          pnpm --filter @atlas/frontend type-check
          pnpm --filter @atlas/ui type-check
          pnpm --filter @atlas/shared type-check

      - name: Build monorepo
        run: pnpm run build

      - name: Run Vitest unit & integration tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test -- --coverage

      - name: Check coverage threshold (90%)
        run: |
          COVERAGE=$(grep -oP '"statements":\s*\K[^,]+' coverage/coverage-summary.json | head -1)
          COVERAGE_NUM=${COVERAGE%\%}
          if (( $(echo "$COVERAGE_NUM < 90" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE_NUM%) is below 90% threshold"
            exit 1
          else
            echo "✅ Coverage ($COVERAGE_NUM%) meets 90% threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-images:
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/atlas-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/atlas-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://api:3001

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-tests:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build project
        run: pnpm run build

      - name: Start services with docker-compose
        run: docker compose up --pull always -d
        env:
          POSTGRES_DB: scm_db
          POSTGRES_PASSWORD: postgres
          JWT_SECRET: test-jwt-secret-key
          COOKIE_SECRET: test-cookie-secret-key

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:3001/health && curl -s http://localhost:8080; do sleep 2; done'

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v

  deploy-notification:
    needs: [lint-and-build, build-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Notify deployment
        run: |
          echo "✅ CI/CD Pipeline completed successfully"
          echo "🐳 Images pushed to Docker Hub:"
          echo "   - ${{ secrets.DOCKER_USERNAME }}/atlas-frontend:latest"
          echo "   - ${{ secrets.DOCKER_USERNAME }}/atlas-backend:latest"
