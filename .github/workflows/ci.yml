name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/cache-clean.yml'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/cache-clean.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build:
    name: Lint, Type Check, Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for sensitive data leaks
        run: pnpm run audit:leaks

      - name: Lint with ESLint
        run: pnpm run lint
        continue-on-error: false

      - name: Type check
        run: |
          pnpm run type-check:backend
          pnpm --filter @atlas/frontend type-check
          pnpm --filter @atlas/ui type-check
          pnpm --filter @atlas/shared type-check

      - name: Build monorepo
        run: pnpm run build

      - name: Prepare database for tests
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Run Vitest unit & integration tests with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-images:
    name: Build & Publish ${{ matrix.component }} Image
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: ./Dockerfile
            suffix: atlas-frontend
          - component: backend
            dockerfile: ./Dockerfile.backend
            suffix: atlas-backend
          - component: worker
            dockerfile: ./Dockerfile.worker
            suffix: atlas-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Check Docker Hub credentials
        id: docker_auth_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
          else
            echo "has_auth=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.docker_auth_check.outputs.has_auth == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target image registries
        id: img-names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/${{ matrix.suffix }}"
          IMAGES="$GHCR_IMAGE"
          if [ "${{ steps.docker_auth_check.outputs.has_auth }}" = "true" ]; then
            IMAGES="${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.suffix }}"$'\n'"$IMAGES"
          fi
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
            echo "ghcr_image=$GHCR_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img-names.outputs.images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1

      - name: Generate SLSA artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img-names.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  e2e-tests:
    name: End-to-End Playwright Tests
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build project
        run: pnpm run build

      - name: Prepare database for E2E
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e
        env:
          JWT_SECRET: test-jwt-secret-key-super-secure-32chars
          COOKIE_SECRET: test-cookie-secret-key-super-secure-32chars
          USE_REDIS_MOCK: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container-config-validation:
    name: Production Compose Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Production Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
        env:
          DATABASE_URL: file:/app/data/prod.db
          JWT_SECRET: smoke-test-jwt-secret-key-super-secure-32chars
          GRAFANA_ADMIN_PASSWORD: smoke-test-grafana-password

  deploy-notification:
    name: Deployment Notification
    needs: [lint-and-build, build-images, e2e-tests, container-config-validation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Publish Deployment Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 CI/CD Pipeline Execution Summary
          - **Monorepo Lint, Type-Check & Unit Tests**: ✅ Passed
          - **End-to-End Playwright Tests (110 specs)**: ✅ Passed
          - **Production Compose Configuration Validation**: ✅ Verified (`docker-compose.prod.yml`)
          - **Container Images (GHCR / Docker Hub)**: ✅ Published (`atlas-frontend`, `atlas-backend`, `atlas-worker`)
          EOF
