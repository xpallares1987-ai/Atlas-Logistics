name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/cache-clean.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/scorecard.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/label.yml'
      - '.github/workflows/project-sync.yml'
      - '.github/workflows/greetings.yml'
      - '.github/workflows/db-push.yml'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/cache-clean.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/scorecard.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/label.yml'
      - '.github/workflows/project-sync.yml'
      - '.github/workflows/greetings.yml'
      - '.github/workflows/db-push.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, Type Check, Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for sensitive data leaks
        run: pnpm run audit:leaks

      - name: Lint with ESLint
        run: pnpm run lint
        continue-on-error: false

      - name: Type check
        run: |
          pnpm run type-check:backend
          pnpm --filter @atlas/frontend type-check
          pnpm --filter @atlas/ui type-check
          pnpm --filter @atlas/shared type-check

      - name: Build monorepo
        run: pnpm run build

      - name: Prepare database for tests
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Verify zero DDL schema drift
        run: pnpm run audit:ddl-drift

      - name: Verify zero legacy documentation regression
        run: pnpm run audit:legacy-docs

      - name: Verify markdown relative link integrity
        run: pnpm run audit:links

      - name: Verify zero-innerHTML DOM safety
        run: pnpm run audit:innerhtml

      - name: Verify DRY file naming conventions
        run: pnpm run audit:naming

      - name: Verify SQLite WAL backup and restoration test
        run: pnpm run test:backup-restore

      - name: Verify SQLite WAL concurrency & multi-station stress test
        run: pnpm run test:concurrency

      - name: Run Vitest unit & integration tests with coverage
        run: pnpm test -- --coverage

      - name: Publish native coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const fs = require("node:fs");
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
              const lines = [
                "### Native Vitest Coverage Summary (Zero External SaaS)",
                "| Metric | Covered / Total | Percentage |",
                "| :--- | :---: | :---: |",
                `| Lines | ${t.lines.covered} / ${t.lines.total} | **${t.lines.pct}%** |`,
                `| Statements | ${t.statements.covered} / ${t.statements.total} | **${t.statements.pct}%** |`,
                `| Functions | ${t.functions.covered} / ${t.functions.total} | **${t.functions.pct}%** |`,
                `| Branches | ${t.branches.covered} / ${t.branches.total} | **${t.branches.pct}%** |`
              ].join("\n") + "\n";
              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines);
              }
              console.log(lines);
            '
          fi

  build-images:
    name: Build & Publish ${{ matrix.component }} Image
    needs: lint-and-build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: ./Dockerfile
            suffix: atlas-frontend
          - component: backend
            dockerfile: ./Dockerfile.backend
            suffix: atlas-backend
          - component: worker
            dockerfile: ./Dockerfile.worker
            suffix: atlas-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Check Docker Hub credentials
        id: docker_auth_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
          else
            echo "has_auth=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.docker_auth_check.outputs.has_auth == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target image registries
        id: img-names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/${{ matrix.suffix }}"
          IMAGES="$GHCR_IMAGE"
          if [ "${{ steps.docker_auth_check.outputs.has_auth }}" = "true" ]; then
            IMAGES="${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.suffix }}"$'\n'"$IMAGES"
          fi
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
            echo "ghcr_image=$GHCR_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img-names.outputs.images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1

      - name: Generate SLSA artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img-names.outputs.ghcr_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  e2e-tests:
    name: End-to-End Playwright Tests
    needs: lint-and-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build project
        run: pnpm run build

      - name: Prepare database for E2E
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e
        env:
          JWT_SECRET: test-jwt-secret-key-super-secure-32chars
          COOKIE_SECRET: test-cookie-secret-key-super-secure-32chars
          USE_REDIS_MOCK: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container-config-validation:
    name: Production Compose Configuration Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Production Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
        env:
          DATABASE_URL: file:/app/data/prod.db
          JWT_SECRET: smoke-test-jwt-secret-key-super-secure-32chars

  verify-provenance:
    name: Verify SLSA Provenance Gate
    needs: [build-images]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Evidence Directory
        run: mkdir -p provenance-evidence

      - name: Verify SLSA Provenance for Published Images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for COMPONENT in atlas-backend atlas-worker atlas-frontend; do
            echo "Verifying SLSA provenance for ${COMPONENT}..."
            gh attestation verify \
              "oci://ghcr.io/${OWNER_LC}/${COMPONENT}:latest" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/ci.yml" \
              --format json > "provenance-evidence/${COMPONENT}-attestation.json"
            echo "✅ ${COMPONENT} SLSA Provenance verified successfully."
          done

      - name: Archive Cryptographic Provenance Evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slsa-provenance-evidence
          path: provenance-evidence/
          retention-days: 90

  deploy-notification:
    name: Deployment Notification
    needs: [lint-and-build, build-images, verify-provenance, e2e-tests, container-config-validation]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Publish Deployment Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 CI/CD Pipeline Execution Summary
          - **Monorepo Lint, Type-Check & Unit Tests**: ✅ Passed
          - **End-to-End Playwright Tests (110 specs)**: ✅ Passed
          - **Production Compose Configuration Validation**: ✅ Verified (`docker-compose.prod.yml`)
          - **Container Images (GHCR / Docker Hub)**: ✅ Published (`atlas-frontend`, `atlas-backend`, `atlas-worker`)
          - **SLSA v1.0 Provenance Gate**: 🛡️ Cryptographically Verified & Enforced (`verify-provenance`)
          EOF
