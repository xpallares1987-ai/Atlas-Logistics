name: CI/CD Pipeline with Docker Build Cloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_BUILD_CLOUD_ENABLED: ${{ secrets.DOCKER_BUILD_CLOUD_ENABLED == 'true' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build:
    name: Lint, Type Check, Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for sensitive data leaks
        run: pnpm run audit:leaks

      - name: Lint with ESLint
        run: pnpm run lint
        continue-on-error: false

      - name: Type check
        run: |
          pnpm run type-check:backend
          pnpm --filter @atlas/frontend type-check
          pnpm --filter @atlas/ui type-check
          pnpm --filter @atlas/shared type-check

      - name: Build monorepo
        run: pnpm run build

      - name: Prepare database for tests
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Run Vitest unit & integration tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-images:
    name: Build & Publish Container Images
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Check Docker Hub credentials
        id: docker_auth_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
          else
            echo "has_auth=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.docker_auth_check.outputs.has_auth == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target image registries
        id: img-names
        run: |
          FE_IMAGES="ghcr.io/${{ github.repository_owner }}/atlas-frontend"
          BE_IMAGES="ghcr.io/${{ github.repository_owner }}/atlas-backend"
          WK_IMAGES="ghcr.io/${{ github.repository_owner }}/atlas-worker"
          if [ "${{ steps.docker_auth_check.outputs.has_auth }}" = "true" ]; then
            FE_IMAGES="${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/atlas-frontend"$'\n'"$FE_IMAGES"
            BE_IMAGES="${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/atlas-backend"$'\n'"$BE_IMAGES"
            WK_IMAGES="${{ env.IMAGE_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/atlas-worker"$'\n'"$WK_IMAGES"
          fi
          {
            echo "fe_images<<EOF"
            echo "$FE_IMAGES"
            echo "EOF"
            echo "be_images<<EOF"
            echo "$BE_IMAGES"
            echo "EOF"
            echo "wk_images<<EOF"
            echo "$WK_IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ========================================================================
      # Frontend Image
      # ========================================================================
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img-names.outputs.fe_images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1

      # ========================================================================
      # Backend Image
      # ========================================================================
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img-names.outputs.be_images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1

      # ========================================================================
      # Worker Image (New)
      # ========================================================================
      - name: Extract metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img-names.outputs.wk_images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=22
            PNPM_VERSION=11.5.1

  e2e-tests:
    name: End-to-End Playwright Tests
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: pnpm run build

      - name: Prepare database for E2E
        run: |
          mkdir -p data
          touch .env.local
          pnpm run db:migrate
          pnpm run db:seed

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e
        env:
          JWT_SECRET: test-jwt-secret-key-super-secure-32chars
          COOKIE_SECRET: test-cookie-secret-key-super-secure-32chars
          USE_REDIS_MOCK: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container-smoke-test:
    name: Container Configuration Smoke Test
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Production Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
        env:
          JWT_SECRET: smoke-test-jwt-secret-key-super-secure-32chars
          GRAFANA_ADMIN_PASSWORD: smoke-test-grafana-password

  deploy-notification:
    name: Deployment Notification
    needs: [lint-and-build, build-images, e2e-tests, container-smoke-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Notify deployment
        run: |
          echo "✅ CI/CD Pipeline completed"
          echo "🐳 3 container images published: frontend, backend, worker"
          echo "🔍 Production Docker Compose configuration validated"
          echo "📊 All tests passed"
