name: Automated Actions Cache Cleanup

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Minimum age in days of BuildKit cache blobs to delete"
        required: false
        default: "5"
      purge_all:
        description: "Purge all caches regardless of age (nuclear option)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Preview caches to delete without deleting"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup-cache:
    name: Prune Stale Caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Cache Cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN_AGE="${{ inputs.min_age_days }}"
          MIN_AGE="${MIN_AGE:-5}"
          PURGE="${{ inputs.purge_all }}"
          DRY="${{ inputs.dry_run }}"

          ARGS="--min-age=$MIN_AGE"
          if [ "$PURGE" = "true" ]; then
            ARGS="$ARGS --all"
          fi
          if [ "$DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Executing: node scripts/maintenance/ci-clean.mjs $ARGS"
          node scripts/maintenance/ci-clean.mjs $ARGS
