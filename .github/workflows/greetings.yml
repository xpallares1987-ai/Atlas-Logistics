name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "👋 Welcome to Atlas Logistics! Thank you for opening your first issue in this repository. Our team will review it shortly. Please ensure your report includes clear reproduction steps and relevant logs."
        pr_message: "🚀 Thank you for your first pull request to Atlas Logistics! Please ensure all unit tests (`pnpm test`), typechecks (`pnpm type-check`), and leak audits (`pnpm run audit:leaks`) pass cleanly. We will review your contribution soon."
