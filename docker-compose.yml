# ==============================================================================
# ATLAS LOGISTICS — DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# ==============================================================================
# Optimized for personal development with hot-reload support.
# Uses SQLite locally, Redis for queues, optional observability stack.
#
# Environment: Loads .env.local automatically (or create from .env.local.example)
#
# Usage:
#   docker compose up --pull always                 # Build & run with hot-reload
#   docker compose down                             # Stop all services
#   docker compose logs -f backend                  # Follow backend logs
#
# ==============================================================================

name: atlas-logistics

x-common-variables: &common_env
  NODE_ENV: development
  LOG_LEVEL: debug

x-health-check: &default_healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # ============================================================================
  # BACKEND SERVICE (Node.js + Fastify)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
    container_name: atlas-backend-dev
    image: atlas-logistics:backend-dev
    pull_policy: build
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      <<: *common_env
      DATABASE_URL: ${DATABASE_URL:-file:./data/dev.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-atlas-enterprise-jwt-secret-key-32chars}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-atlas-documents}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      # Source code for hot-reload (cached mount for performance)
      - ./src:/app/src:cached
      - ./packages:/app/packages:cached
      # Protect in-container node_modules from Windows host symlink overrides
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/frontend/node_modules
      - /app/packages/client-sdk/node_modules
      # Data persistence
      - ./data:/app/data:cached
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      <<: *default_healthcheck
    networks:
      default:
        aliases:
          - api
          - backend
    # Resource limits to prevent runaway processes
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # FRONTEND SERVICE (Nginx reverse proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: atlas-frontend-dev
    image: atlas-logistics:frontend-dev
    pull_policy: build
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      <<: *default_healthcheck
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # REDIS (Message Queue & Cache)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    container_name: atlas-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # MINIO OBJECT STORAGE (S3-Compatible Document Vault)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: atlas-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # MINIO AUTO-PROVISIONING (Bucket Initialization)
  # ============================================================================
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: atlas-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/atlas-documents --ignore-existing;
      echo 'MinIO bucket atlas-documents ready.';
      exit 0;
      "
    networks:
      - default

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: atlas-network
    driver: bridge

