# ==============================================================================
# ATLAS LOGISTICS — DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# ==============================================================================
# Optimized for personal development with hot-reload support.
# Uses SQLite locally, Redis for queues, optional observability stack.
#
# Environment: Loads .env.local automatically (or create from .env.local.example)
#
# Usage:
#   docker compose up --pull always                 # Build & run with hot-reload
#   docker compose down                             # Stop all services
#   docker compose logs -f backend                  # Follow backend logs
#
# ==============================================================================

name: atlas-logistics

x-common-variables: &common_env
  NODE_ENV: development
  LOG_LEVEL: debug

x-health-check: &default_healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # ============================================================================
  # BACKEND SERVICE (Node.js + Fastify)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
    container_name: atlas-backend-dev
    image: atlas-logistics:backend-dev
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      <<: *common_env
      DATABASE_URL: ${DATABASE_URL:-file:./data/dev.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    volumes:
      # Source code for hot-reload (cached mount for performance)
      - ./src:/app/src:cached
      - ./packages:/app/packages:cached
      # Data persistence
      - ./data:/app/data:cached
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      <<: *default_healthcheck
    networks:
      default:
        aliases:
          - api
          - backend
    # Resource limits to prevent runaway processes
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # FRONTEND SERVICE (Nginx reverse proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: atlas-frontend-dev
    image: atlas-logistics:frontend-dev
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      <<: *default_healthcheck
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # REDIS (Message Queue & Cache)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    container_name: atlas-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: atlas-network
    driver: bridge

