# ==============================================================================
# ATLAS LOGISTICS — DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# ==============================================================================
# Optimized for personal development. Uses SQLite locally, Redis for queues.
# PostgreSQL, Prometheus, Grafana, and Node Exporter are optional/production-only.
#
# Usage:
#   pnpm dev              # Starts Redis only (recommended)
#   pnpm dev:observability # Starts Redis + Prometheus + Grafana
#   pnpm dev:stop         # Stops all containers
#
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # ESSENTIAL FOR DEVELOPMENT
  # ============================================================================

  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    container_name: atlas-redis-dev

  # ============================================================================
  # OPTIONAL: OBSERVABILITY (Uncomment to enable)
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    pull_policy: if_not_present
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: atlas-prometheus-dev
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    pull_policy: if_not_present
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-atlas2024}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: atlas-grafana-dev
    profiles:
      - observability

  node-exporter:
    image: prom/node-exporter:latest
    pull_policy: if_not_present
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    container_name: atlas-node-exporter-dev
    profiles:
      - observability

  # ============================================================================
  # PRODUCTION SERVICES (Orchestrated in docker-compose.prod.yml)
  # ============================================================================
  # For production deployment with zero-CVE Chainguard containers, persistent
  # storage and Nginx ingress reverse proxy, run:
  #
  #   docker compose -f docker-compose.prod.yml up -d --build
  # ============================================================================

volumes:
  prometheus_data:
  grafana_data:
