# ==============================================================================
# ATLAS LOGISTICS — DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# ==============================================================================
# Optimized for personal development with hot-reload support.
# Uses SQLite locally, Redis for queues.
#
# Usage:
#   docker compose up -d                  # Backend + Redis
#   docker compose --profile observability up -d  # + Prometheus + Grafana
#   docker compose down                   # Stop all services
#   docker compose logs -f backend        # Follow backend logs
#
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # BACKEND SERVICE (Node.js + Express/Fastify)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
    container_name: atlas-backend-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./data/dev.db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - JWT_SECRET=dev-secret-key-change-in-production
    volumes:
      # Source code for hot-reload
      - ./src:/app/src:cached
      - ./packages:/app/packages:cached
      # Data persistence
      - ./data:/app/data:cached
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      default:
        aliases:
          - api
          - backend

  # ============================================================================
  # FRONTEND SERVICE (Nginx reverse proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22
        PNPM_VERSION: 10.0.0
        VITE_API_URL: http://localhost:3001
    container_name: atlas-frontend-dev
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # REDIS (Message Queue & Cache)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    pull_policy: if_not_present
    container_name: atlas-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # PROMETHEUS (Metrics Collection) — Optional
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    pull_policy: if_not_present
    container_name: atlas-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - observability

  # ============================================================================
  # GRAFANA (Visualization) — Optional
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    pull_policy: if_not_present
    container_name: atlas-grafana-dev
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-atlas2024}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - observability

  # ============================================================================
  # NODE EXPORTER (System Metrics) — Optional
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    pull_policy: if_not_present
    container_name: atlas-node-exporter-dev
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    profiles:
      - observability

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: atlas-network
    driver: bridge
