apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: atlas-logistics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'atlas-logistics'
        environment: 'production'

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
    # Prometheus self-monitoring
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

    # Kubernetes pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

    # Atlas Backend
    - job_name: 'atlas-backend'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - atlas-logistics
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: backend
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "3001"
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:3001
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod_name

    # Redis
    - job_name: 'redis'
      static_configs:
      - targets: ['redis:6379']
      metrics_path: '/metrics'

    # PostgreSQL (via postgres_exporter)
    - job_name: 'postgres'
      static_configs:
      - targets: ['postgres-exporter:9187']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: atlas-logistics
data:
  atlas-alerts.yml: |
    groups:
    - name: atlas_alerts
      interval: 30s
      rules:

      # Backend alerts
      - alert: BackendDown
        expr: up{job="atlas-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend service is down"
          description: "Backend pod {{ $labels.kubernetes_pod_name }} in {{ $labels.kubernetes_namespace }} is down"

      - alert: BackendHighErrorRate
        expr: rate(http_requests_total{job="atlas-backend",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend error rate is high"
          description: "Backend error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: BackendHighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="atlas-backend"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend P99 latency is high"
          description: "Backend P99 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      - alert: BackendMemoryUsage
        expr: container_memory_usage_bytes{pod=~"backend-.*"} / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend memory usage is critical"
          description: "Backend pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

      - alert: BackendCPUThrottling
        expr: rate(container_cpu_cfs_throttled_seconds_total{pod=~"backend-.*"}[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend CPU is being throttled"
          description: "Backend pod {{ $labels.pod }} CPU throttling rate is {{ $value | humanizePercentage }}"

      # Redis alerts
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis service is down"
          description: "Redis instance is unavailable"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis memory usage is critical"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      - alert: RedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis is evicting keys"
          description: "Redis eviction rate is {{ $value | humanize }} keys/sec"

      # PostgreSQL alerts
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL instance is unavailable"

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_statements_mean_time{query!~".*vacuum.*"}[5m]) > 1000
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "Average query time is {{ $value | humanizeDuration }}"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL connection pool usage is high"
          description: "Connection usage is {{ $value | humanizePercentage }} of max"

      # Worker alerts
      - alert: WorkerDown
        expr: up{job="kubernetes-pods",__meta_kubernetes_pod_label_app="worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "Worker pod is down"
          description: "Worker pod {{ $labels.kubernetes_pod_name }} is down"

      - alert: WorkerQueueBacklog
        expr: bullmq_queue_count{queue!="completed"} > 1000
        for: 10m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "Worker queue backlog is high"
          description: "Queue {{ $labels.queue }} has {{ $value | humanize }} pending jobs"

      # Kubernetes/Node alerts
      - alert: NodeMemoryPressure
        expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Node experiencing memory pressure"
          description: "Node {{ $labels.node }} is under memory pressure"

      - alert: PodCrashLoopBackOff
        expr: kube_pod_container_status_restarts_total > 5
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Pod is in CrashLoopBackOff"
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} restarted {{ $value }} times"

      - alert: PersistentVolumeUsageHigh
        expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "PersistentVolume usage is high"
          description: "PersistentVolume {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: atlas-logistics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=30d'
          - '--web.enable-lifecycle'
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-rules
      - name: storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: atlas-logistics
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: atlas-logistics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: atlas-logistics
