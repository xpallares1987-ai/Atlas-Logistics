<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlas Logistics Enterprise</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, then completes a redirect to the entry point
      // so that browser history state and React Router work seamlessly.

      var l = window.location;
      var path = l.pathname;
      var pathSegmentsToKeep = 1; // Default for project pages: /Atlas-Logistics/

      // Dynamic segment preservation for PR preview subdirectories
      // e.g. /Atlas-Logistics/pr-preview/pr-42/... -> keep 3 segments
      if (path.indexOf("/pr-preview/pr-") !== -1) {
        pathSegmentsToKeep = 3;
      }

      var redirectUrl =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        l.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/") +
        "/?/" +
        l.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
