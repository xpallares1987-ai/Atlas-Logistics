global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'atlas-logistics'
    cluster: 'prod-eu-west-2'
    instance_name: 'cheerfulmole1135-prom'

# Optional Grafana Cloud Remote Write (mimir-prod-72 / eu-central-1)
# Mount secret token at /etc/prometheus/secrets/grafana_cloud_prom_token when enabling remote_write:
# remote_write:
#   - url: https://prometheus-prod-72-prod-eu-west-4.grafana.net/api/prom/push
#     basic_auth:
#       username: '3759940'
#       password_file: /etc/prometheus/secrets/grafana_cloud_prom_token

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fastify API
  - job_name: 'fastify-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'fastify-api-instance'

  # Node exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'
