apiVersion: 1

contactPoints:
  - orgId: 1
    name: atlas-default-email
    receivers:
      - uid: atlas-alerts-default
        type: email
        settings:
          addresses: alerts@atlas-logistics.local
          singleEmail: true

policies:
  - orgId: 1
    receiver: atlas-default-email
    group_by: ['alertname', 'cluster', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
