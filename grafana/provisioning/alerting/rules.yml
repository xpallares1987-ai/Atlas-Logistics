apiVersion: 1

groups:
  - orgId: 1
    name: atlas-critical-alerts
    folder: Infrastructure & Core
    interval: 30s
    rules:
      - uid: sqlite-wal-stall
        title: SQLiteWALCheckpointStall
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sqlite_wal_frames > 10000
              instant: true
        for: 3m
        labels:
          severity: critical
          service: database
        annotations:
          summary: SQLite WAL Checkpoint Stall
          description: SQLite WAL frames have exceeded 10,000 for more than 3 minutes, indicating a stalled checkpoint or checkpoint lock contention.

      - uid: sqlite-busy-timeout
        title: SQLiteBusyTimeoutErrors
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(sqlite_busy_timeout_errors_total[5m]) > 0
              instant: true
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: SQLite Busy Timeout Occurred
          description: SQLite busy_timeout (5000ms) lock contention errors detected on database connections.

      - uid: http-5xx-spike
        title: HTTP5xxSpike
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(http_requests_total{status=~"5.."}[5m]) / (rate(http_requests_total[5m]) + 0.0001) > 0.02
              instant: true
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: HTTP 5xx Spike
          description: HTTP 5xx server error rate exceeds 2% of total traffic.

      - uid: redis-latency-high
        title: RedisCommandLatencyHigh
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(redis_command_duration_seconds_bucket[5m])) > 0.05
              instant: true
        for: 3m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Redis Command Latency High
          description: P95 Redis command duration exceeds 50 milliseconds.
